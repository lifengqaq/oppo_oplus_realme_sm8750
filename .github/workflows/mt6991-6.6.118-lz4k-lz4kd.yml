name: MT6991 6.6.118 LZ4K LZ4KD Build

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Kernel branch or tag"
        required: true
        default: "port/mt6991-6.6.118-lz4k-lz4kd"
        type: string

permissions:
  contents: read

env:
  KERNEL_REPOSITORY: lifengqaq/android_kernel_oneplus_mt6991
  TOOLCHAIN_URL: https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REF: ${{ inputs.kernel_ref }}

    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl dwarves flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            libelf-dev libssl-dev python3 python-is-python3 rsync unzip xz-utils zip

      - name: Build and verify LZ4K LZ4KD
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace"
          git clone --depth=1 --branch "$KERNEL_REF" \
            "https://github.com/${KERNEL_REPOSITORY}.git" \
            "$GITHUB_WORKSPACE/kernel_workspace/common"
          cd "$GITHUB_WORKSPACE/kernel_workspace"
          curl -fL --retry 3 --retry-delay 5 "$TOOLCHAIN_URL" -o clang.zip
          unzip -q clang.zip -d clang18
          clang_path="$(find "$PWD/clang18" -type f -path '*/bin/clang' -print -quit)"
          test -n "$clang_path"
          export PATH="$(dirname "$clang_path"):$PATH"
          cd common
          make_args=(
            LLVM=1
            ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
            CC="ccache clang"
            LD=ld.lld
            HOSTCC=clang
            HOSTLD=ld.lld
            O=out
            "KCFLAGS+=-Wno-error"
          )
          make -j"$(nproc)" "${make_args[@]}" gki_defconfig 2>&1 | tee build.log
          for config in \
            CONFIG_CRYPTO_LZ4K=y CONFIG_LZ4K_COMPRESS=y CONFIG_LZ4K_DECOMPRESS=y \
            CONFIG_CRYPTO_LZ4KD=y CONFIG_LZ4KD_COMPRESS=y CONFIG_LZ4KD_DECOMPRESS=y; do
            grep -qx "$config" out/.config
          done
          grep -qx 'CONFIG_ZRAM_DEF_COMP="lzo-rle"' out/.config
          cp out/.config lz4k-lz4kd.config
          make -j"$(nproc)" "${make_args[@]}" Image drivers/block/zram/zcomp.o 2>&1 | tee -a build.log
          test -s out/arch/arm64/boot/Image
          test -s out/crypto/lz4k.o
          test -s out/crypto/lz4kd.o
          test -s out/drivers/block/zram/zcomp.o

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt6991-6.6.118-lz4k-lz4kd-${{ github.run_number }}
          path: |
            kernel_workspace/common/build.log
            kernel_workspace/common/lz4k-lz4kd.config
          if-no-files-found: warn
          retention-days: 14

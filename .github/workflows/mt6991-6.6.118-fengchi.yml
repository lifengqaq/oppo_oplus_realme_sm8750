name: MT6991 6.6.118 Fengchi Build

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: "Kernel fork branch or tag"
        required: true
        default: "port/mt6991-6.6.118-fengchi"
        type: string

permissions:
  contents: read

env:
  KERNEL_REPOSITORY: lifengqaq/android_kernel_oneplus_mt6991
  TOOLCHAIN_URL: https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang18-r510928/clang-r510928.zip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REF: ${{ inputs.kernel_ref }}

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl dwarves flex \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabihf \
            libelf-dev libssl-dev python3 python-is-python3 rsync \
            unzip xz-utils zip

      - name: Fetch kernel source and Clang 18
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/kernel_workspace"
          git clone --depth=1 --branch "$KERNEL_REF" \
            "https://github.com/${KERNEL_REPOSITORY}.git" \
            "$GITHUB_WORKSPACE/kernel_workspace/common"
          git -C "$GITHUB_WORKSPACE/kernel_workspace/common" rev-parse HEAD \
            | tee "$GITHUB_WORKSPACE/kernel_workspace/kernel-commit.txt"

          cd "$GITHUB_WORKSPACE/kernel_workspace"
          curl -fL --retry 3 --retry-delay 5 "$TOOLCHAIN_URL" -o clang-r510928.zip
          unzip -q clang-r510928.zip -d clang18
          clang_path="$(find "$PWD/clang18" -type f -path '*/bin/clang' -print -quit)"
          test -n "$clang_path"
          printf 'CLANG_BIN=%s\n' "$(dirname "$clang_path")" >> "$GITHUB_ENV"

      - name: Configure GKI with Fengchi enabled
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          export PATH="$CLANG_BIN:$PATH"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_NOHASHDIR=true
          mkdir -p "$CCACHE_DIR"

          cd "$GITHUB_WORKSPACE/kernel_workspace/common"
          make_args=(
            LLVM=1
            ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
            CC="ccache clang"
            LD=ld.lld
            HOSTCC=clang
            HOSTLD=ld.lld
            O=out
            "KCFLAGS+=-Wno-error"
          )

          make -j"$(nproc)" "${make_args[@]}" gki_defconfig 2>&1 | tee build.log
          scripts/config --file out/.config --enable HMBIRD_SCHED
          scripts/config --file out/.config --disable SCHED_CLASS_EXT
          scripts/config --file out/.config --disable SLIM_SCHED
          make -j"$(nproc)" "${make_args[@]}" olddefconfig 2>&1 | tee -a build.log

          grep -qx 'CONFIG_HMBIRD_SCHED=y' out/.config
          if grep -Eq '^CONFIG_(SCHED_CLASS_EXT|SLIM_SCHED)=y$' out/.config; then
            echo "Stock SCX/SLIM scheduler remained enabled" >&2
            exit 1
          fi
          cp out/.config fengchi.config

      - name: Build Image
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          export PATH="$CLANG_BIN:$PATH"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
          export CCACHE_COMPILERCHECK=content
          export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
          export CCACHE_NOHASHDIR=true

          cd "$GITHUB_WORKSPACE/kernel_workspace/common"
          make_args=(
            LLVM=1
            ARCH=arm64
            CROSS_COMPILE=aarch64-linux-gnu-
            CROSS_COMPILE_ARM32=arm-linux-gnueabihf-
            CC="ccache clang"
            LD=ld.lld
            HOSTCC=clang
            HOSTLD=ld.lld
            O=out
            "KCFLAGS+=-Wno-error"
          )

          make -j"$(nproc)" "${make_args[@]}" Image 2>&1 | tee -a build.log
          test -s out/arch/arm64/boot/Image
          test -s out/vmlinux
          test -s out/System.map
          test -s out/kernel/sched/build_policy.o
          ccache --show-stats

      - name: Verify Fengchi objects and symbols
        shell: bash
        run: |
          set -euo pipefail
          set -o pipefail
          export PATH="$CLANG_BIN:$PATH"
          cd "$GITHUB_WORKSPACE/kernel_workspace/common"

          llvm_nm="$CLANG_BIN/llvm-nm"
          test -x "$llvm_nm"
          "$llvm_nm" out/vmlinux > vmlinux-symbols.txt

          for symbol in \
            hmbird_sched_class \
            init_sched_hmbird_class \
            hmbird_ctrl \
            hmbird_free \
            __hmbird_ops_enabled; do
            grep -Eq "[[:space:]]${symbol}$" vmlinux-symbols.txt || {
              echo "Missing Fengchi symbol: ${symbol}" >&2
              exit 1
            }
          done

          if grep -Eq '[[:space:]]ext_sched_class$' vmlinux-symbols.txt; then
            echo "Stock ext_sched_class is still linked" >&2
            exit 1
          fi

          {
            echo "Kernel commit: $(cat ../kernel-commit.txt)"
            echo "Configuration:"
            grep -E 'CONFIG_(HMBIRD_SCHED|SCHED_CLASS_EXT|SLIM_SCHED)=' out/.config || true
            echo
            echo "Fengchi symbols:"
            grep -E '[[:space:]](hmbird_sched_class|init_sched_hmbird_class|hmbird_ctrl|hmbird_free|__hmbird_ops_enabled)$' vmlinux-symbols.txt
            echo
            echo "Scheduler object:"
            ls -lh out/kernel/sched/build_policy.o
          } | tee fengchi-verification.txt

      - name: Upload build and verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt6991-6.6.118-fengchi-log-${{ github.run_number }}
          path: |
            kernel_workspace/common/build.log
            kernel_workspace/common/fengchi-verification.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Image and build metadata
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mt6991-6.6.118-fengchi-${{ github.run_number }}
          path: |
            kernel_workspace/common/out/arch/arm64/boot/Image
            kernel_workspace/common/out/System.map
            kernel_workspace/common/out/Module.symvers
            kernel_workspace/common/fengchi.config
            kernel_workspace/common/fengchi-verification.txt
            kernel_workspace/kernel-commit.txt
          if-no-files-found: error
          retention-days: 14
